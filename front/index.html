<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteSup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- ============ Barra superior: marca centrada + estado de la cámara ============ -->
    <header class="barra-superior">
        <div class="marca">
            <img id="logo-negocio" class="logo" src="img/logo.svg" alt="Logo">
            <span id="nombre-negocio" class="nombre-negocio"></span>
        </div>
        <div class="barra-derecha">
            <div id="estado-camara" class="badge-camara">
                <span class="dot-camara"></span>
                <span id="estado-camara-texto">Conectando…</span>
            </div>
        </div>
    </header>

    <!-- ============ Pantalla de espera (sin cliente frente a la cámara) ============ -->
    <div id="pantalla-espera" class="pantalla-espera">
        <div class="espera-tarjeta">
            <div class="espera-icono"><i class="fa-solid fa-hand"></i></div>
            <h1 class="espera-titulo">Bienvenido a InteSup</h1>
            <p class="espera-subtitulo">Acércate a la cámara para ver productos recomendados para ti</p>
            <p id="espera-estado" class="espera-pulso">Buscando clientes…</p>
        </div>
    </div>

    <!-- ============ Pantalla del trabajador (clientes.es_trabajador = 1) ============
         Pide la huella una vez; durante el cooldown solo muestra "modo trabajador". -->
    <div id="pantalla-empleado" class="pantalla-espera pantalla-empleado" hidden>
        <div class="espera-tarjeta">
            <div class="espera-icono"><i id="empleado-icono" class="fa-solid fa-fingerprint"></i></div>
            <h1 id="empleado-titulo" class="espera-titulo">Hola</h1>
            <p id="empleado-texto" class="espera-subtitulo"></p>
            <p id="empleado-pulso" class="espera-pulso"></p>
        </div>
    </div>

    <!-- ============ Contenido principal ============ -->
    <main class="layout">
        <!-- Izquierda: recomendaciones personales del cliente -->
        <aside class="panel-recomendaciones">
            <div class="recomendaciones-cabecera">
                <span class="recomendaciones-icono"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                <div>
                    <h2 id="saludo-titulo" class="recomendaciones-titulo">Sugerencias para ti</h2>
                    <p id="saludo-subtitulo" class="recomendaciones-subtitulo">Según tus compras anteriores</p>
                </div>
            </div>
            <div id="recomendaciones" class="recomendaciones-lista" aria-live="polite"></div>
        </aside>

        <!-- Derecha: productos más vendidos para todos -->
        <section class="panel-productos">
            <h1 class="panel-titulo"><i class="fa-solid fa-fire"></i> Lo más vendido</h1>
            <div id="contenedor-cartas" class="grid-cartas"></div>
        </section>
    </main>

    <!-- ============ Ventana emergente: por qué se recomienda ============ -->
    <div id="modal" class="modal" hidden>
        <div class="modal-fondo" data-cerrar></div>
        <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <button class="modal-cerrar" type="button" aria-label="Cerrar" data-cerrar><i class="fa-solid fa-xmark"></i></button>
            <img id="modal-imagen" class="modal-imagen" alt="">
            <div class="modal-cuerpo">
                <h3 id="modal-titulo" class="modal-titulo"></h3>
                <span id="modal-precio" class="modal-precio"></span>
                <p class="modal-etiqueta"><i class="fa-solid fa-circle-info"></i> ¿Por qué te lo recomendamos?</p>
                <p id="modal-razon" class="modal-razon"></p>
            </div>
        </div>
    </div>

    <!-- ============ Scripts (el orden importa) ============ -->
    <script src="js/config.js"></script>            <!-- datos del negocio y de la API -->
    <script src="js/utils.js"></script>             <!-- precio, imagen por defecto, barra superior -->
    <script src="js/api-recomendaciones.js"></script> <!-- llamadas a api_web.py -->
    <script src="js/cartas.js"></script>            <!-- cartas de "Lo más vendido" -->
    <script src="js/recomendaciones.js"></script>   <!-- panel "Sugerencias para ti" -->
    <script src="js/modal.js"></script>             <!-- ventana "¿Por qué te lo recomendamos?" -->
    <script src="js/main.js"></script>              <!-- arranque y monitoreo de la cámara -->
</body>
</html>
