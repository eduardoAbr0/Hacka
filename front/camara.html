<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/camara.css">
</head>
<body>
    <!-- Barra superior con logo y nombre del negocio -->
    <header class="barra-superior">
        <img id="logo-negocio" class="logo" src="img/logo.svg" alt="Logo">
        <span id="nombre-negocio" class="nombre-negocio"></span>
        <nav class="nav">
            <a href="index.html" class="nav-link">Productos</a>
            <a href="ventas.html" class="nav-link">Mi carrito</a>
            <a href="camara.html" class="nav-link activo">Cámara</a>
        </nav>
    </header>

    <main class="camara-layout">
        <!-- Izquierda: foto grande -->
        <section class="visor">
            <div class="visor-cabecera">
                <h1 class="visor-titulo">Última foto HD</h1>
                <span id="estado-esp32" class="estado desconectado">
                    <span class="estado-punto"></span>
                    <span id="estado-texto">Buscando la API…</span>
                </span>
            </div>

            <!-- Panel de Control de Cámara Celular -->
            <div class="panel-camara-celular" style="margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <button id="btn-trigger" class="btn btn-primario" type="button" style="padding: 8px 16px; cursor: pointer;">
                    📸 Tomar Foto Ahora (Celular)
                </button>
                <div style="display: inline-flex; gap: 6px; align-items: center;">
                    <label for="input-ip-celular" style="font-size: 0.85rem; color: var(--texto-secundario, #666);">IP Celular:</label>
                    <input id="input-ip-celular" type="text" placeholder="http://10.32.0.62:8080/shot.jpg" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; width: 230px;">
                    <button id="btn-guardar-ip" type="button" style="padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc;">Guardar IP</button>
                </div>
            </div>

            <div class="visor-foto">
                <img id="foto-grande" alt="Foto tomada" hidden>
                <p id="visor-vacio" class="visor-vacio">📷<br>Aún no hay fotos</p>
            </div>

            <div class="visor-pie">
                <span id="foto-info" class="foto-info"></span>
                <span class="aviso-sensor">📡 Al acercar un objeto a menos de 20 cm del ESP32, se tomará una foto HD automáticamente desde la cámara del celular.</span>
            </div>
        </section>

        <!-- Derecha: galería de fotos anteriores -->
        <aside class="galeria">
            <h2 class="galeria-titulo">Fotos <span id="galeria-conteo" class="galeria-conteo"></span></h2>
            <ul id="galeria-lista" class="galeria-lista"></ul>
        </aside>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api-fotos.js"></script>
    <script src="js/camara.js"></script>
</body>
</html>
