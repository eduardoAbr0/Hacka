<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito · InteSup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/ventas.css">
</head>
<body>
    <!-- Barra superior: marca centrada + navegación a la derecha -->
    <header class="barra-superior">
        <div class="marca">
            <img id="logo-negocio" class="logo" src="img/logo.svg" alt="Logo">
            <span id="nombre-negocio" class="nombre-negocio"></span>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-store"></i> Productos</a>
            <a href="ventas.html" class="nav-link activo"><i class="fa-solid fa-cart-shopping"></i> Mi carrito</a>
        </nav>
    </header>

    <main class="ventas-layout">
        <!-- Izquierda: lista de compras con scroll + botones -->
        <section class="ventas-panel">
            <div class="ventas-cabecera">
                <h1 class="ventas-titulo"><i class="fa-solid fa-cart-shopping"></i> Mi carrito</h1>
                <span id="conteo-productos" class="ventas-conteo"></span>
            </div>

            <!-- Banner de Autenticación Facial -->
            <div id="banner-facial" class="banner-facial bloqueado">
                <div class="facial-icono"><i id="facial-icono" class="fa-solid fa-lock"></i></div>
                <div class="facial-info">
                    <strong id="facial-titulo">Identificación facial requerida</strong>
                    <span id="facial-subtitulo">Acércate a la cámara de la laptop para identificarte con tu rostro.</span>
                </div>
            </div>

            <p id="aviso-escanear" class="aviso-escanear" style="display: none;">
                <i class="aviso-icono fa-solid fa-barcode"></i>
                <span class="aviso-texto">Escanea el código de barras de tus productos usando la cámara de tu celular.</span>
            </p>

            <ul id="lista-compras" class="lista-compras"></ul>

            <div class="ventas-acciones">
                <button id="btn-eliminar" class="btn btn-peligro" type="button" disabled><i class="fa-solid fa-trash"></i> Vaciar carrito</button>
            </div>
        </section>

        <!-- Derecha: total y pago -->
        <aside class="resumen">
            <h2 class="resumen-titulo">Resumen de compra</h2>
            <div class="resumen-fila resumen-fila-cliente">
                <span>Cliente</span>
                <span id="resumen-cliente" class="resumen-cliente bloqueado"></span>
            </div>
            <div class="resumen-fila">
                <span>Productos</span>
                <span id="resumen-cantidad">0</span>
            </div>
            <div class="resumen-total">
                <span class="resumen-total-etiqueta">Total a pagar</span>
                <span id="resumen-total" class="resumen-total-valor">$0.00</span>
            </div>
            <button id="btn-pagar" class="btn btn-pagar" type="button" disabled><i class="fa-solid fa-credit-card"></i> Confirmar pago</button>
            <button id="btn-cancelar" class="btn btn-cancelar" type="button" disabled><i class="fa-solid fa-xmark"></i> Cancelar</button>
        </aside>
    </main>


    <!-- Diálogo: confirmar / avisos -->
    <div id="dialogo-mensaje" class="dialogo" hidden>
        <div class="dialogo-fondo" data-cerrar></div>
        <div class="dialogo-caja dialogo-chico" role="dialog" aria-modal="true" aria-labelledby="mensaje-titulo">
            <div id="mensaje-icono" class="dialogo-icono"></div>
            <h3 id="mensaje-titulo" class="dialogo-titulo"></h3>
            <p id="mensaje-texto" class="dialogo-texto"></p>
            <div class="dialogo-botones">
                <button id="mensaje-no" class="btn btn-secundario" type="button" data-cerrar>No</button>
                <button id="mensaje-si" class="btn btn-primario" type="button">Sí</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api-fotos.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/dialogo.js"></script>
    <script src="js/ventas.js"></script>
</body>
</html>
