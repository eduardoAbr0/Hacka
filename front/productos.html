<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión e Inventario de Productos</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .nav-enlaces {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--texto-suave);
            background: var(--bg);
            border: 1px solid var(--borde);
            transition: all 0.2s ease;
        }
        .btn-nav:hover, .btn-nav.activo {
            background: var(--acento);
            color: #ffffff;
            border-color: var(--acento);
        }

        .layout-admin {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            padding: 24px;
            min-height: calc(100vh - var(--alto-barra));
        }

        .panel-form {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            padding: 24px;
            box-shadow: var(--sombra);
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: fit-content;
        }

        .form-titulo {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grupo-campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grupo-campo label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grupo-campo input, .grupo-campo select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--borde);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .grupo-campo input:focus, .grupo-campo select:focus {
            border-color: var(--acento);
            box-shadow: 0 0 0 3px var(--acento-suave);
        }

        .btn-guardar {
            padding: 12px;
            background: var(--acento);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-guardar:hover {
            background: #1d4ed8;
        }

        .alerta-mensaje {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }
        .alerta-exito {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .alerta-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .panel-tabla {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: var(--radio);
            padding: 24px;
            box-shadow: var(--sombra);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
        }

        .tabla-cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .input-buscar {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--borde);
            font-size: 0.9rem;
            width: 260px;
        }

        .contenedor-tabla {
            overflow-x: auto;
            border: 1px solid var(--borde);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        th {
            background: var(--bg);
            padding: 12px 16px;
            font-weight: 700;
            color: var(--texto-suave);
            border-bottom: 1px solid var(--borde);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--borde);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .badge-origen {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .origen-local { background: #e0f2fe; color: #0369a1; }
        .origen-api { background: #f3e8ff; color: #6b21a8; }

        @media (max-width: 850px) {
            .layout-admin { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="barra-superior">
        <img id="logo-negocio" class="logo" src="img/logo.svg" alt="Logo">
        <span id="nombre-negocio" class="nombre-negocio"></span>
    </header>

    <main class="layout-admin">
        <!-- Formulario de Registro -->
        <section class="panel-form">
            <h2 class="form-titulo">📦 Nuevo Producto</h2>
            <p style="font-size: 0.88rem; color: var(--texto-suave);">Escanea un código de barras o ingresa los datos manualmente:</p>

            <div id="alerta" class="alerta-mensaje"></div>

            <form id="form-producto">
                <div class="grupo-campo">
                    <label for="codigo_barras">Código de Barras</label>
                    <input type="text" id="codigo_barras" placeholder="Ej. 7501055310884" autofocus required>
                </div>

                <div class="grupo-campo">
                    <label for="nombre">Nombre del Producto</label>
                    <input type="text" id="nombre" placeholder="Ej. Coca-Cola Original 600ml" required>
                </div>

                <div class="grupo-campo">
                    <label for="categoria">Categoría</label>
                    <select id="categoria">
                        <option value="Bebidas">Bebidas</option>
                        <option value="Snacks">Snacks</option>
                        <option value="Lácteos">Lácteos</option>
                        <option value="Abarrotes">Abarrotes</option>
                        <option value="Panadería">Panadería</option>
                        <option value="Limpieza">Limpieza</option>
                        <option value="General" selected>General</option>
                    </select>
                </div>

                <div class="grupo-campo">
                    <label for="precio">Precio ($)</label>
                    <input type="number" id="precio" step="0.50" min="0" placeholder="0.00" required>
                </div>

                <div class="grupo-campo">
                    <label for="stock">Stock Inicial</label>
                    <input type="number" id="stock" min="0" value="50" required>
                </div>

                <button type="submit" class="btn-guardar">
                    <span>💾</span> Guardar Producto
                </button>
            </form>
        </section>

        <!-- Tabla de Inventario -->
        <section class="panel-tabla">
            <div class="tabla-cabecera">
                <div>
                    <h2 class="form-titulo">📋 Inventario Registrado</h2>
                    <p id="total-productos-txt" style="font-size: 0.88rem; color: var(--texto-suave);">Cargando catálogo...</p>
                </div>
                <input type="text" id="input-buscar" class="input-buscar" placeholder="🔍 Buscar por nombre o código...">
            </div>

            <div class="contenedor-tabla">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código de Barras</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Origen</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                        <!-- Render dinámico desde JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/admin_productos.js"></script>
</body>
</html>
